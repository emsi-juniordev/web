<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#01060c">
  <title>Welcome | Log In</title>
 
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <!-- Animated aurora background (fills any screen size) -->
  <div class="sky" id="sky" aria-hidden="true">
    <div class="aurora-layer">
      <div class="aurora a1"></div>
      <div class="aurora a2"></div>
      <div class="aurora a3"></div>
    </div>
    <canvas id="skyCanvas"></canvas>
  </div>
 
  <main class="stage">
    <section class="card" id="card">
 
      <!-- LOG IN -->
      <form class="view active" id="loginForm" data-view="login" novalidate>
        <h1 class="title">Welcome!</h1>
 
        <div class="group">
          <div class="field">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5Z"/></svg>
            <input id="loginUser" type="text" placeholder="username or email" autocomplete="username" aria-label="Username or email">
          </div>
          <p class="error" role="alert"></p>
        </div>
 
        <div class="group">
          <div class="field">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 9V7a5 5 0 0 0-10 0v2a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-8-2a3 3 0 0 1 6 0v2H9V7Zm3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/></svg>
            <input id="loginPass" type="password" placeholder="password" autocomplete="current-password" aria-label="Password">
            <button type="button" class="eye" aria-label="Show password" aria-pressed="false">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.1 8.6 1 12c1.1 3.4 5.5 7 11 7s9.9-3.6 11-7c-1.1-3.4-5.5-7-11-7Zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.8 2.8 1.4 4.2l3.2 3.2C2.9 8.7 1.6 10.3 1 12c1.1 3.4 5.5 7 11 7 1.9 0 3.6-.4 5.1-1.1l2.7 2.7 1.4-1.4L2.8 2.8ZM12 16.5a4.5 4.5 0 0 1-4.5-4.5c0-.6.1-1.1.3-1.6l5.8 5.8c-.5.2-1 .3-1.6.3ZM12 5c-1.2 0-2.3.2-3.4.5l2.1 2.1a4.5 4.5 0 0 1 5.7 5.7l3.1 3.1c1.6-1.2 2.9-2.8 3.5-4.4C22 8.6 17.600 5 12 5Z"/></svg>
            </button>
          </div>
          <p class="error" role="alert"></p>
        </div>
 
        <p class="form-msg" id="loginMsg" role="alert"></p>
 
        <button class="btn" type="submit">
          <span class="btn-text">Log In</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
 
        <p class="switch">Doesn’t have an account yet?<br><a href="#" data-goto="signup">Sign up</a></p>
      </form>
 
      <!-- SIGN UP -->
      <form class="view" id="signupForm" data-view="signup" novalidate>
        <h1 class="title">Join us!</h1>
 
        <div class="group">
          <div class="field">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.4 0-8 2.2-8 5v3h16v-3c0-2.8-3.6-5-8-5Z"/></svg>
            <input id="signupUser" type="text" placeholder="username" autocomplete="username" aria-label="Username">
          </div>
          <p class="error" role="alert"></p>
        </div>
 
        <div class="group">
          <div class="field">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm9 7.200L4.500 7v.1L12 12.600 19.500 7.100V7L12 12.200Z"/></svg>
            <input id="signupEmail" type="email" placeholder="email" autocomplete="email" aria-label="Email">
          </div>
          <p class="error" role="alert"></p>
        </div>
 
        <div class="group">
          <div class="field">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 9V7a5 5 0 0 0-10 0v2a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-8-2a3 3 0 0 1 6 0v2H9V7Zm3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/></svg>
            <input id="signupPass" type="password" placeholder="password" autocomplete="new-password" aria-label="Password">
            <button type="button" class="eye" aria-label="Show password" aria-pressed="false">
              <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.1 8.6 1 12c1.1 3.4 5.5 7 11 7s9.9-3.6 11-7c-1.1-3.4-5.5-7-11-7Zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9Zm0-7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5Z"/></svg>
              <svg class="eye-closed" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.8 2.8 1.4 4.2l3.2 3.2C2.9 8.7 1.6 10.3 1 12c1.1 3.4 5.5 7 11 7 1.9 0 3.6-.4 5.1-1.1l2.7 2.7 1.4-1.4L2.8 2.8ZM12 16.5a4.5 4.5 0 0 1-4.5-4.5c0-.6.1-1.1.3-1.6l5.8 5.8c-.5.2-1 .3-1.6.3ZM12 5c-1.2 0-2.3.2-3.4.5l2.1 2.1a4.5 4.5 0 0 1 5.7 5.7l3.1 3.1c1.6-1.2 2.9-2.8 3.5-4.4C22 8.6 17.600 5 12 5Z"/></svg>
            </button>
          </div>
          <div class="strength" id="strength" aria-hidden="true"><span></span></div>
          <p class="error" role="alert"></p>
        </div>
 
        <div class="group">
          <div class="field">
            <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 9V7a5 5 0 0 0-10 0v2a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2Zm-8-2a3 3 0 0 1 6 0v2H9V7Zm3 11a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z"/></svg>
            <input id="signupConfirm" type="password" placeholder="confirm password" autocomplete="new-password" aria-label="Confirm password">
          </div>
          <p class="error" role="alert"></p>
        </div>
 
        <button class="btn" type="submit">
          <span class="btn-text">Sign Up</span>
          <span class="spinner" aria-hidden="true"></span>
        </button>
 
        <p class="switch">Already have an account?<br><a href="#" data-goto="login">Log in</a></p>
      </form>
 
      <!-- LOGGED-IN VIEW -->
      <div class="view" data-view="home">
        <h1 class="title">Hello!</h1>
        <p class="home-name" id="homeName"></p>
        <p class="home-clock" id="homeClock"></p>
        <p class="home-note">You’re logged in. Replace this panel with your own page content.</p>
        <button class="btn" type="button" id="logoutBtn"><span class="btn-text">Log Out</span></button>
      </div>
 
    </section>
  </main>
 
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
 
  <script src="script.js"></script>
</body>
</html>
